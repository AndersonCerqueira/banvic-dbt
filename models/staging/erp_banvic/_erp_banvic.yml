
sources:
  - name: erp
    description: Esse é o sistema ERP da Banvic com dados de cliente, colaboradores, contas e transações;
    schema: erp_banvic #nome do recurso dentro do DataBricks
    tables:
      - name: localidades
        description: Tabela fonte de localidades com informações de cidade e estado.

      - name: clientes
        description: Tabela de clientes com informações pessoais de cada cliente da Banvic.

      - name: colaboradores
        description: Tabela de colaboradores com informações pessoais de cada cliente da Banvic.

      - name: agencias
        description: Tabela de agencias com informações pessoais de cada cliente da Banvic.